<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edge Pattern Language — Admin</title><link rel="stylesheet" href="style.css"></head><body><header><h1>EDGE<br>PATTERN<br>LANGUAGE</h1><p>Admin Sequence • Network • Field Notes</p></header><main class="admin"><section><h2>Add Pattern</h2><form id="patternForm"><label>Pattern Name</label><input id="title" required><label>Introductory Passage</label><textarea id="summary"></textarea><label>Category</label><select id="category"><option>Spatial Pattern</option><option>Temporal Pattern</option><option>Social Pattern</option><option>Governance Pattern</option><option>Ritual Pattern</option><option>Technology Pattern</option><option>Children’s Town Pattern</option><option>Anti-Pattern</option></select><label>Confidence</label><select id="status"><option>Seed</option><option>Emerging</option><option>Strong</option><option>Mature</option></select><label>Problem</label><textarea id="problem"></textarea><label>Forces / Observations</label><textarea id="forces"></textarea><label>Evidence</label><textarea id="evidence"></textarea><label>Solution</label><textarea id="solution"></textarea><label>Examples</label><textarea id="examples"></textarea><label>Tags</label><input id="tags" placeholder="meals, arrival, belonging"><label>Related Patterns</label><input id="related" placeholder="Soft Arrival Zone, Productive Drift"><button type="submit">Save Pattern</button></form></section><section><div class="tabs"><button id="linearTab" class="active">Sequence</button><button id="networkTab">Network</button></div><div id="linearView"></div><div id="networkView" class="hidden"><h2>Base Map of the Language</h2><svg id="network"></svg></div></section></main><script src="app.js"></script><script>window.PATTERN_ADMIN=true;loadPatterns();</script></body></html>
